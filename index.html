<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo Centrado</title>
  
  <!-- Favicon directo en línea con SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="./assets/css/styles.css">
  
  <!-- Script JS (defer para cargar después del HTML) -->
  <script src="./assets/js/main.js" defer></script>
</head>
<body>

  <!-- Botón superior de tema -->
  <header class="header-actions">
    <button id="themeToggleBtn" class="btn-icon" aria-label="Cambiar tema">
      🌙 <span id="themeLabel">Modo Claro</span>
    </button>
  </header>

  <!-- Contenido principal centrado -->
  <main class="container">
    <div class="card">
      <span class="badge">Ejemplo de Hola Mundo</span>
      
      <!-- Título principal -->
      <h1 id="greeting">¡Hola Mundo!</h1>
      <p class="subtitle">Bienvenido a tu sitio web moderno y responsivo.</p>

      <!-- Panel de control de tamaño de texto -->
      <div class="controls">
        <label for="fontSizeControl">Tamaño de letra:</label>
        <div class="button-group">
          <button id="btnDecrease" class="btn-control">-</button>
          <span id="sizeValue">1.0rem (16px)</span>
          <button id="btnIncrease" class="btn-control">+</button>
          <button id="btnReset" class="btn-secondary">Restablecer</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>© 2026 - Creado con HTML, CSS y JS</p>
  </footer>

</body>
</html>
